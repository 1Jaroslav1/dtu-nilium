name: smoke_test
board: 14port
modules:
  - {id: st7735_tft, instance: st7735_tft, ports: [1, 2]}
  - {id: button, instance: button, port: 7}
code:
  globals: |
    // Centered text on the 160x80 screen (canvas mode: caller does display()).
    void showCentered(const char* text, uint16_t color) {
      st7735_tft.setTextSize(2);
      st7735_tft.setTextColor(color);
      int16_t x = (st7735_tft.width() - st7735_tft.textWidth(text)) / 2;
      int16_t y = (st7735_tft.height() - st7735_tft.lineHeight()) / 2;
      st7735_tft.setCursor(x < 0 ? 0 : x, y < 0 ? 0 : y);
      st7735_tft.print(text);
    }
  setup: |
    st7735_tft.clear();
    showCentered("Atech OK", ST7735_TFT::COLOR_WHITE);
    st7735_tft.display();
    button.off();
  loop: |
    // isPressed() polls the level, so the firmware's own press/release events
    // ("button", 1/0) keep working. Redraw only when the state changes, so the
    // boot message stays until the first press.
    static bool wasDown = false;
    bool down = button.isPressed();
    if (down != wasDown) {
      wasDown = down;
      if (down) {
        st7735_tft.fillRect(0, 0, st7735_tft.width(), st7735_tft.height(), ST7735_TFT::COLOR_GREEN);
        showCentered("PRESSED", ST7735_TFT::COLOR_BLACK);
        button.setColor(0, 255, 0);
      } else {
        st7735_tft.clear();
        showCentered("ready", ST7735_TFT::COLOR_WHITE);
        button.off();
      }
      st7735_tft.display();
    }

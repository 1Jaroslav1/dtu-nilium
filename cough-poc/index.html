<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cough counter</title>
<style>
  :root {
    --bg: #f4f6f9; --panel: #ffffff; --fg: #15202e; --muted: #5b6878; --line: #d9dfe7;
    --accent: #c2410c; --accent-fg: #ffffff; --ok: #15803d; --bar: #2563eb;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f141b; --panel: #18202b; --fg: #e6ebf1; --muted: #93a0b0; --line: #2a3542;
            --accent: #f97316; --accent-fg: #1a0d03; --ok: #4ade80; --bar: #60a5fa; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.45 system-ui, sans-serif; }
  main { max-width: 46rem; margin: 0 auto; padding: 1.5rem 1rem 3rem; }
  h1 { font-size: 1.4rem; margin: 0 0 .25rem; }
  .sub { color: var(--muted); margin: 0 0 1.25rem; font-size: .9rem; word-break: break-all; }
  #tap { display: block; width: 100%; padding: 2.2rem 1rem; border: 0; border-radius: 1rem;
         background: var(--accent); color: var(--accent-fg); font: 700 1.6rem/1.2 system-ui, sans-serif;
         cursor: pointer; transition: transform .06s; }
  #tap:active, #tap.hit { transform: scale(.98); filter: brightness(1.1); }
  .hint { color: var(--muted); font-size: .85rem; text-align: center; margin: .5rem 0 1.25rem; }
  .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: .6rem; }
  .tile { background: var(--panel); border: 1px solid var(--line); border-radius: .75rem; padding: .7rem .8rem; }
  .tile b { display: block; font-size: 1.8rem; font-variant-numeric: tabular-nums; }
  .tile span { color: var(--muted); font-size: .8rem; }
  .level { margin: 1rem 0; background: var(--panel); border: 1px solid var(--line); border-radius: .75rem; padding: .7rem .8rem; }
  .meter { height: .6rem; background: var(--line); border-radius: 1rem; overflow: hidden; margin-top: .35rem; }
  .meter i { display: block; height: 100%; width: 0; background: var(--bar); transition: width .2s; }
  table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--line); border-radius: .75rem; overflow: hidden; }
  th, td { text-align: left; padding: .45rem .7rem; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; font-size: .9rem; }
  th { color: var(--muted); font-weight: 600; }
  tr.new td { background: color-mix(in srgb, var(--accent) 14%, transparent); }
  #status { color: var(--muted); font-size: .85rem; margin-top: 1rem; }
  #status.err { color: var(--accent); }
</style>
<main>
  <h1>Cough counter</h1>
  <p class="sub" id="folder">connecting…</p>

  <button id="tap">I just coughed</button>
  <p class="hint">One tap per cough, right after it. Space works too.</p>

  <div class="tiles">
    <div class="tile"><b id="coughs">0</b><span>detected</span></div>
    <div class="tile"><b id="taps">0</b><span>your taps</span></div>
    <div class="tile"><b id="time">0:00</b><span>recorded</span></div>
  </div>

  <div class="level">
    <span id="levelText">Level —</span>
    <div class="meter"><i id="meter"></i></div>
  </div>

  <table>
    <thead><tr><th>Time</th><th>Score</th><th>Peak (rel.)</th><th>Energy (rel.)</th></tr></thead>
    <tbody id="recent"><tr><td colspan="4">No coughs yet</td></tr></tbody>
  </table>
  <p id="status"></p>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  let seen = 0;

  function clock(s) {
    const m = Math.floor(s / 60), h = Math.floor(m / 60);
    const mm = String(m % 60).padStart(h ? 2 : 1, '0'), ss = String(Math.floor(s % 60)).padStart(2, '0');
    return (h ? h + ':' : '') + mm + ':' + ss;
  }

  async function tap() {
    $('tap').classList.add('hit');
    setTimeout(() => $('tap').classList.remove('hit'), 120);
    try {
      const r = await fetch('/tap', { method: 'POST' });
      $('taps').textContent = (await r.json()).taps;
    } catch { $('status').textContent = 'Tap not saved: server unreachable'; $('status').className = 'err'; }
  }
  $('tap').addEventListener('click', tap);
  document.addEventListener('keydown', (e) => {
    if (e.code === 'Space' && !e.repeat) { e.preventDefault(); tap(); }
  });

  async function poll() {
    try {
      const s = await (await fetch('/state')).json();
      $('folder').textContent = s.folder;
      $('coughs').textContent = s.coughs;
      $('taps').textContent = s.taps;
      $('time').textContent = clock(s.seconds);
      $('levelText').textContent = `Level ${s.level_dbfs.toFixed(0)} dBFS` +
        (s.level_dbfs > -1 ? ' · clipping: too close to the mic, step back' : '');
      $('meter').style.width = Math.max(0, Math.min(100, (s.level_dbfs + 80) / 80 * 100)) + '%';
      if (s.recent.length) {
        const fresh = s.coughs - seen;
        $('recent').innerHTML = s.recent.map((c, i) =>
          `<tr class="${i < fresh && seen ? 'new' : ''}"><td>${c.wall_time.slice(11, 19)}</td>` +
          `<td>${c.cough_score.toFixed(2)}</td><td>${c.peak_dbfs.toFixed(0)} dBFS</td><td>${c.energy_db.toFixed(0)} dB</td></tr>`).join('');
      }
      seen = s.coughs;
      $('status').textContent = s.lost ? `${s.lost} samples lost on USB` : 'Live';
      $('status').className = '';
    } catch {
      $('status').textContent = 'Server stopped or unreachable';
      $('status').className = 'err';
    }
    setTimeout(poll, 500);
  }
  poll();
</script>
</html>
